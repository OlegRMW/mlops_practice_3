[tool.poetry]
name = "mlops-data-practice"
version = "1.0.0"
description = "Reproducible Iris/Wine data versions with DVC and ClearML"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
dvc = "3.63.0"
clearml = "2.0.2"
scikit-learn = "1.7.2"
pandas = "2.3.3"
pathspec = "0.12.1"
dulwich = "0.24.10"

[tool.poetry.group.demo.dependencies]
nbclient = "0.10.2"
ipykernel = "7.0.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
